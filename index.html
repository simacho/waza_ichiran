<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script src="./csvData.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- SVG ICON COMPONENT ---
    const Icon = ({ name, className = "w-5 h-5", filled, ...props }) => {
      const icons = {
        search: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
        ),
        filter: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
        ),
        play: (
          <svg className={className} fill="currentColor" viewBox="0 0 24 24" {...props}>
            <polygon points="5 3 19 12 5 21 5 3"/>

        ),
        check: (

        ),
        checkCircle: (

          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>

        ),
        plus: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        ),
        barChart: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        ),
        bell: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        ),
        bookOpen: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        ),
        layers: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        ),
        video: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        ),
        arrowUpDown: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>
          </svg>
        ),
        star: (
          <svg className={className} fill={filled ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        ),
        refresh: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        ),
        externalLink: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        ),
        sparkles: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>
          </svg>
        ),
        download: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" {...props}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        )
      };
      return icons[name] || null;
    };

    // --- DATA & TYPES ---
    const GRADE_COLUMNS = [
      '少年7級', '少年5・6級', '少年3・4級', '少年2・1級', '少年初段', '少年二段',
      '7・8級', '5・6級', '4級', '3級', '2級', '1級',
      '初段', '二段', '三段'
    ];

    const ALL_GRADES = ['すべて', ...GRADE_COLUMNS];

    const GRIP_CATEGORIES = [
      'すべて',
      '正面打ち',
      '※正面打ち',
      '横面打ち',
      '※横面打ち',
      '片手持ち',
      '※片手持ち',
      '両手持ち',
      '※両手持ち',
      '肘持ち',
      '※肘持ち',
      '肩持ち',
      '※肩持ち',
      '胸持ち',
      '※胸持ち',
      '片手綾持ち',
      '※片手綾持ち',
      '正面突き',
      '※正面突き',
      '後技両手持ち',
      '後技片手襟持ち',
      '後技両肘持ち',
      '後技両肩持ち',
      '後技襟持ち ',
      '半身半立ち片手持ち',
      '半身半立ち両手持ち',
      '肩持ち正面打ち',
      '正面横面打ち',
      '短刀取り',
      '短刀横面取り',
      '剣取り',
      '２人取り',
      '３人取り '
    ];

    const RAW_CSV_TEXT = window.RAW_CSV_TEXT || '';

    function inferGrades(rawGrip, name, stance, numberLabel) {
      const grip = rawGrip || '';
      const n = name || '';
      const num = numberLabel || '';
      const isSuwari = grip.startsWith('※') || stance === '座り技';
      const cleanGrip = grip.replace(/^※/, '');

      // 特殊技（短刀・剣・多人数・自由技・半身半立ち）
      if (
        cleanGrip.includes('短刀') ||
        cleanGrip.includes('剣') ||
        cleanGrip.includes('取り') ||
        cleanGrip.includes('半身半立ち') ||
        n.includes('自由技')
      ) {
        return ['初段', '二段', '三段', '少年初段'];
      }

      // 後ろ技
      if (cleanGrip.startsWith('後ろ技') || cleanGrip.startsWith('後技')) {
        if (cleanGrip.includes('両手持ち') && (n.includes('一ヵ条') || n.includes('小手返し'))) {
          return ['1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
        }
        return ['初段', '二段', '三段', '少年初段'];
      }

      // 座り技
      if (isSuwari) {
        if (cleanGrip === '正面打ち') {
          if (n.includes('一ヵ条')) return ['5・6級', '4級', '3級', '2級', '1級', '初段', '二段', '三段', '少年5・6級', '少年3・4級', '少年2・1級', '少年初段'];
          if (n.includes('二ヵ条')) return ['4級', '3級', '2級', '1級', '初段', '二段', '三段', '少年3・4級', '少年2・1級', '少年初段'];
          if (n.includes('三ヵ条')) return ['3級', '2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
          if (n.includes('四ヵ条')) return ['2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
          return ['2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
        }
        if (cleanGrip === '横面打ち') {
          if (n.includes('一ヵ条')) return ['2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
          if (n.includes('二ヵ条')) return ['1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
          return ['初段', '二段', '三段', '少年初段'];
        }
        if (cleanGrip === '片手持ち') {
          if (n.includes('一ヵ条')) return ['1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
          return ['初段', '二段', '三段', '少年初段'];
        }
        return ['初段', '二段', '三段', '少年初段'];
      }

      // 立ち技：級別判定
      if (
        (cleanGrip === '片手持ち' && (n.includes('四方投げ') || (n.includes('側面入身投げ') && num === '①') || (n.includes('肘締め') && num === '①'))) ||
        (cleanGrip === '正面打ち' && (n.includes('一ヵ条') || (n.includes('正面入身投げ') && num === '①'))) ||
        (cleanGrip === '両手持ち' && n.includes('天地投げ'))
      ) {
        return ['7・8級', '5・6級', '4級', '3級', '2級', '1級', '初段', '二段', '三段', '少年7級', '少年5・6級', '少年3・4級', '少年2・1級', '少年初段'];
      }

      if (
        (cleanGrip === '正面打ち' && (n.includes('二ヵ条') || n.includes('肘締め'))) ||
        (cleanGrip === '片手持ち' && n.includes('二ヵ条')) ||
        (cleanGrip === '横面打ち' && n.includes('四方投げ')) ||
        (cleanGrip === '肩持ち' && n.includes('一ヵ条')) ||
        (cleanGrip === '両手持ち' && n.includes('四方投げ'))
      ) {
        return ['5・6級', '4級', '3級', '2級', '1級', '初段', '二段', '三段', '少年5・6級', '少年3・4級', '少年2・1級', '少年初段'];
      }

      if (
        (cleanGrip === '正面打ち' && n.includes('三ヵ条')) ||
        (cleanGrip === '横面打ち' && n.includes('一ヵ条')) ||
        (cleanGrip === '両手持ち' && n.includes('二ヵ条')) ||
        (cleanGrip === '肘持ち' && n.includes('一ヵ条')) ||
        (cleanGrip === '片手持ち' && n.includes('小手返し'))
      ) {
        return ['4級', '3級', '2級', '1級', '初段', '二段', '三段', '少年3・4級', '少年2・1級', '少年初段'];
      }

      if (
        (cleanGrip === '正面打ち' && (n.includes('四ヵ条') || n.includes('小手返し') || n.includes('側面入身投げ'))) ||
        (cleanGrip === '横面打ち' && n.includes('二ヵ条')) ||
        (cleanGrip === '肩持ち' && n.includes('二ヵ条')) ||
        (cleanGrip === '胸持ち' && n.includes('一ヵ条'))
      ) {
        return ['3級', '2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
      }

      if (
        (cleanGrip === '横面打ち' && (n.includes('三ヵ条') || n.includes('側面入身投げ'))) ||
        (cleanGrip === '肘持ち' && n.includes('二ヵ条')) ||
        (cleanGrip === '正面突き' && n.includes('二ヵ条')) ||
        (cleanGrip === '両手持ち' && n.includes('三ヵ条')) ||
        (cleanGrip === '片手綾持ち' && n.includes('二ヵ条'))
      ) {
        return ['2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
      }

      if (
        (cleanGrip === '横面打ち' && n.includes('四ヵ条')) ||
        (cleanGrip === '肩持ち' && n.includes('三ヵ条')) ||
        (cleanGrip === '胸持ち' && n.includes('二ヵ条')) ||
        (cleanGrip === '正面突き' && n.includes('小手返し'))
      ) {
        return ['1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
      }

      if (
        (cleanGrip === '肩持ち' && n.includes('四ヵ条')) ||
        (cleanGrip === '胸持ち' && (n.includes('三ヵ条') || n.includes('四ヵ条'))) ||
        (cleanGrip === '正面打ち' && n.includes('肘当て呼吸投げ'))
      ) {
        return ['初段', '二段', '三段', '少年初段'];
      }

      return ['3級', '2級', '1級', '初段', '二段', '三段', '少年2・1級', '少年初段'];
    }

    function parseCsvToTechniques(csvText) {
      if (!csvText) return [];
      const lines = csvText.trim().split('\n');
      const techniques = [];

      lines.forEach((line, index) => {
        if (!line.trim()) return;
        const parts = line.split(',').map(s => s ? s.trim() : '');
        if (parts.length < 4) return;

        const firstCol = parts[0];
        if (firstCol === 'No' || firstCol === '持ち手' || firstCol === '技名1') {
          return; // Skip header
        }

        let rawGrip = '';
        let name = '';
        let numberLabel = '';
        let stanceFromCsv = '';
        let displayNameFromCsv = '';
        let rawVideoUrl = '';
        let gradeColStartIndex = -1;

        if (!isNaN(parseInt(firstCol, 10)) && parts.length >= 7) {
          // Format 1: No,持ち手,技名,①②区分,種別,技名表記,動画URL
          rawGrip = parts[1];
          name = parts[2];
          numberLabel = parts[3];
          stanceFromCsv = parts[4];
          displayNameFromCsv = parts[5];
          rawVideoUrl = parts[6];
          gradeColStartIndex = 7;
        } else if (parts[3] && (parts[3].startsWith('http') || parts[3].includes('x.com') || parts[3] === 'URL')) {
          // Format 2: 技名1,技名2,技名3,URL,少年7級... (19-col CSV with URL at index 3, grade cols index 4 to 18)
          rawGrip = parts[0];
          name = parts[1];
          numberLabel = parts[2];
          rawVideoUrl = parts[3];
          gradeColStartIndex = 4;
        } else if (parts.length >= 19) {
          // Format 3: 持ち手,技名,①②区分,種別,少年7級...
          rawGrip = parts[0];
          name = parts[1];
          numberLabel = parts[2];
          stanceFromCsv = parts[3];
          displayNameFromCsv = `${rawGrip} ${name} ${numberLabel}`.trim();
          gradeColStartIndex = 4;
        } else {
          // Fallback: 技名1,技名2,技名3,URL,...
          rawGrip = parts[0];
          name = parts[1];
          numberLabel = parts[2];
          rawVideoUrl = parts[3] || '';
          gradeColStartIndex = 4;
        }

        if (!rawGrip && !name) return;

        const isSuwariWaza = rawGrip.startsWith('※') || stanceFromCsv === '座り技';
        const cleanGrip = rawGrip.replace(/^※/, '');

        let videoUrl = rawVideoUrl;
        if (videoUrl && videoUrl.includes('x.com/smaurai_kaze')) {
          videoUrl = videoUrl.replace('x.com/smaurai_kaze', 'x.com/samurai_kaze');
        }

        let grades = [];
        if (gradeColStartIndex >= 0 && parts.length >= gradeColStartIndex) {
          for (let i = 0; i < GRADE_COLUMNS.length; i++) {
            const val = parts[gradeColStartIndex + i] ? parts[gradeColStartIndex + i].trim() : '';
            if (val !== '' && val !== '0' && val !== 'false' && val !== '×' && val !== '-') {
              grades.push(GRADE_COLUMNS[i]);
            }
          }
        }

        // CSVの各級段カラム（E列〜S列）に「1」がある場合のみ、該当級段に割り当てる
        const primaryGrade = grades.length > 0 ? grades[0] : '';
        const displayName = displayNameFromCsv || `${rawGrip} ${name} ${numberLabel}`.trim();

        techniques.push({
          id: `tech-table-${index + 1}`,
          rawGrip,
          grip: cleanGrip || rawGrip,
          isSuwariWaza,
          name: name || '技',
          numberLabel,
          displayName,
          videoUrl,
          description: '',
          keyPoints: [
            `${displayName}に対する足さばきと手刀の軌道を同期させる`,
            '中心軸をブレさせずに腰の回転で力を効率的に伝える',
            '相手の重心をくずし、安全かつ確実に技を極める'
          ],
          grade: primaryGrade,
          grades,
          category: isSuwariWaza ? '座り技' : '立ち技',
          reading: '',
          difficultyRating: grades.some(g => g.includes('初段') || g.includes('二段') || g.includes('三段')) ? 4 : 2,
          isMastered: false,
          isFavorite: false
        });
      });

      return techniques;
    }

    const INITIAL_TECHNIQUES = parseCsvToTechniques(RAW_CSV_TEXT);
    const LOCAL_STORAGE_KEY = 'aistudio_techniques_v17_csv_exact';

    // 文字列の正規化（全角・半角、カタカナ・ひらがな、漢数字・丸数字、スペース除去など）
    function normalizeText(str) {
      if (!str) return '';
      return String(str)
        .normalize('NFKC')
        .toLowerCase()
        .replace(/[\s\t\n\r　]+/g, '')
        .replace(/[①１1一]/g, '1')
        .replace(/[②２2二]/g, '2')
        .replace(/[③３3三]/g, '3')
        .replace(/[④４4四]/g, '4')
        .replace(/[⑤５5五]/g, '5')
        .replace(/ヵ|カ|か/g, '力');
    }

    // 保存済みデータの読み込み（動画URLや基本属性は常に最新CSVを優先しつつ、習得・お気に入り状態を復元）
    function loadSavedTechniques() {
      try {
        const savedJson = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (savedJson) {
          const savedList = JSON.parse(savedJson);
          if (Array.isArray(savedList)) {
            const savedStateMap = new Map();
            savedList.forEach((t) => {
              if (t && t.id) {
                savedStateMap.set(String(t.id), {
                  isMastered: Boolean(t.isMastered),
                  isFavorite: Boolean(t.isFavorite)
                });
              }
            });

            const merged = INITIAL_TECHNIQUES.map((t) => {
              const savedState = savedStateMap.get(String(t.id));
              return savedState ? { ...t, ...savedState } : t;
            });

            const customTechs = savedList.filter(
              (t) => t && t.id && String(t.id).startsWith('custom-')
            );

            return [...merged, ...customTechs];
          }
        }
      } catch (e) {
        console.error('Failed to load saved techniques:', e);
      }
      return INITIAL_TECHNIQUES;
    }

    // --- COMPONENTS ---

    // Header
    const Header = ({ onOpenAddModal }) => {
      return (
        <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 py-3">
          <div className="max-w-7xl mx-auto flex items-center justify-between gap-2">

    // AddTechniqueModal

    // --- MAIN APP COMPONENT ---
    function App() {
      const [techniques, setTechniques] = useState(() => loadSavedTechniques());

      const [selectedGrade, setSelectedGrade] = useState('すべて');
      const [searchQuery, setSearchQuery] = useState('');
      const [stanceFilter, setStanceFilter] = useState('全部');
      const [filterFavoritesOnly, setFilterFavoritesOnly] = useState(false);

      const [selectedTechnique, setSelectedTechnique] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);

      // Save techniques
      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(techniques));
        } catch (e) {}
      }, [techniques]);

      // Grade counts
      const gradeCounts = useMemo(() => {
        const counts = {};
        ALL_GRADES.forEach((g) => {
          if (g === 'すべて') {
            counts[g] = techniques.length;
          } else {
            counts[g] = techniques.filter((t) =>
              t.grades && t.grades.length > 0 ? t.grades.includes(g) : t.grade === g
            ).length;
          }
        });
        return counts;
      }, [techniques]);

      // Filtered techniques (iOS Safari & Android Chrome 対応)
      const filteredTechniques = useMemo(() => {
        let list = [...techniques];

        // 1. 級段位フィルター
        if (selectedGrade !== 'すべて') {
          list = list.filter((t) => {
            if (t.grades && t.grades.length > 0) {
              return t.grades.includes(selectedGrade);
            }
            return t.grade === selectedGrade;
          });
        }

        // 2. 立ち技・座り技フィルター
        if (stanceFilter === '立ち技のみ') {
          list = list.filter((t) => !t.isSuwariWaza && !(t.rawGrip && t.rawGrip.startsWith('※')));
        } else if (stanceFilter === '座り技のみ') {
          list = list.filter((t) => t.isSuwariWaza || (t.rawGrip && t.rawGrip.startsWith('※')));
        }

        // 3. お気に入りフィルター
        if (filterFavoritesOnly) {
          list = list.filter((t) => t.isFavorite);
        }

        // 4. 検索クエリフィルター（ひらがな・カタカナ・全角半角・漢数字・数字の自動吸収正規化）
        if (searchQuery.trim()) {
          const q = normalizeText(searchQuery);
          list = list.filter((t) => {
            const targetStr = normalizeText(
              `${t.displayName || ''} ${t.rawGrip || ''} ${t.grip || ''} ${t.name || ''} ${t.category || ''} ${t.numberLabel || ''} ${t.videoUrl || ''}`
            );
            return targetStr.includes(q);
          });
        }

        return list;
      }, [techniques, selectedGrade, stanceFilter, filterFavoritesOnly, searchQuery]);

      // Handlers
      const handleToggleMastered = (id) => {
        setTechniques((prev) =>
          prev.map((t) => (t.id === id ? { ...t, isMastered: !t.isMastered } : t))
        );
        if (selectedTechnique && selectedTechnique.id === id) {
          setSelectedTechnique((prev) => prev ? { ...prev, isMastered: !prev.isMastered } : null);
        }
      };

      const handleToggleFavorite = (id) => {
        setTechniques((prev) =>
          prev.map((t) => (t.id === id ? { ...t, isFavorite: !t.isFavorite } : t))
        );
        if (selectedTechnique && selectedTechnique.id === id) {
          setSelectedTechnique((prev) => prev ? { ...prev, isFavorite: !prev.isFavorite } : null);
        }
      };

      const handleAddTechnique = (newTech) => {
        const created = { ...newTech, id: `custom-${Date.now()}` };
        setTechniques((prev) => [created, ...prev]);
      };

      const handleResetData = () => {
        if (window.confirm('データのリセットを行い、初期技データ（306技）に戻しますか？')) {
          localStorage.removeItem(LOCAL_STORAGE_KEY);
          setTechniques(INITIAL_TECHNIQUES);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          <Header
            onOpenAddModal={() => setIsAddModalOpen(true)}
          />

          <main className="max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-4 flex-1">
            <SearchBar
              searchMode={searchQuery}
              onSearchChange={setSearchQuery}
              stanceFilter={stanceFilter}
              onStanceFilterChange={setStanceFilter}
              filterFavoritesOnly={filterFavoritesOnly}
              onToggleFavoritesOnly={() => setFilterFavoritesOnly(!filterFavoritesOnly)}
            />

            <GradeFilter
              grades={ALL_GRADES}
              selectedGrade={selectedGrade}
              onSelectGrade={setSelectedGrade}
              gradeCounts={gradeCounts}
            />

            {/* List Header / Stats bar */}
            <div className="flex items-center justify-between px-1 text-xs text-slate-500 font-medium">
              <p>
                該当する技: <span className="font-bold text-[#003d9b]">{filteredTechniques.length}</span> 件
                {selectedGrade !== 'すべて' && <span className="ml-1 text-slate-600">({selectedGrade})</span>}
                {stanceFilter !== '全部' && <span className="ml-1 text-slate-600">[{stanceFilter}]</span>}
              </p>

              <button
                onClick={handleResetData}
                className="flex items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors"
                title="初期化"
              >
                <Icon name="refresh" className="w-3.5 h-3.5" />
                <span>データ初期化</span>
              </button>
            </div>

            {/* Techniques Grid */}
            {filteredTechniques.length > 0 ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {filteredTechniques.map((tech) => (
                  <TechniqueCard
                    key={tech.id}
                    technique={tech}
                    onSelect={setSelectedTechnique}
                    onToggleMastered={handleToggleMastered}
                    onToggleFavorite={handleToggleFavorite}
                  />
                ))}
              </div>
            ) : (
              <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-xs space-y-3">
                <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                  <Icon name="search" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-700">条件に一致する技が見つかりませんでした</h3>
                <p className="text-xs text-slate-500 max-w-sm mx-auto">
                  検索条件または級段位フィルターを変更して再度お試しください。
                </p>
                <button
                  onClick={() => {
                    setSelectedGrade('すべて');
                    setStanceFilter('全部');
                    setSearchQuery('');
                    setFilterFavoritesOnly(false);
                  }}
                  className="px-4 py-2 bg-indigo-50 text-[#003d9b] font-bold text-xs rounded-xl hover:bg-indigo-100 transition-colors"
                >
                  フィルターをリセット
                </button>
              </div>
            )}
          </main>

          <footer className="mt-auto border-t border-slate-200 bg-white px-4 py-3 text-center text-xs text-slate-500">
            <div className="flex items-center justify-center gap-1.5 font-medium text-slate-600">
              <Icon name="bookOpen" className="w-3.5 h-3.5 text-[#003d9b]" />
              <span>塩田合気道・風</span>
            </div>
          </footer>

          {/* Modals */}
          <VideoModal
            technique={selectedTechnique}
            onClose={() => setSelectedTechnique(null)}
            onToggleMastered={handleToggleMastered}
            onToggleFavorite={handleToggleFavorite}
          />

          <AddTechniqueModal
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            onAddTechnique={handleAddTechnique}
          />
        </div>
      );
    }

    // Error Boundary
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("App Error Boundary caught an error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl shadow-md max-w-md w-full text-center space-y-4 border border-slate-200">
                <div className="w-12 h-12 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                  !
                </div>
                <h2 className="text-base font-bold text-slate-800">アプリの表示で一時的な問題が発生しました</h2>
                <p className="text-xs text-slate-500 leading-relaxed">
                  表示データを再読み込みするか、データを初期化してお試しください。
                </p>
                <div className="flex flex-col gap-2 pt-2">
                  <button
                    onClick={() => window.location.reload()}
                    className="w-full py-2.5 bg-[#003d9b] text-white font-bold text-xs rounded-xl shadow-xs hover:bg-[#002e75] transition-colors"
                  >
                    ページを再読み込み
                  </button>
                  <button
                    onClick={() => {
                      try {
                        localStorage.clear();
                      } catch (e) {}
                      window.location.reload();
                    }}
                    className="w-full py-2 bg-slate-100 text-slate-600 font-semibold text-xs rounded-xl hover:bg-slate-200 transition-colors"
                  >
                    キャッシュデータをリセット
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Render Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
