    function parseCsvToTechniques(csvText) {
      const lines = csvText.trim().split('\n');
      const techniques = [];

      lines.forEach((line, index) => {
        const parts = line.split(',');
        if (parts.length < 4) return;

        const rawGrip = parts[0] ? parts[0].trim() : '';
        const name = parts[1] ? parts[1].trim() : '';
        const numberLabel = parts[2] ? parts[2].trim() : '';
        const rawVideoUrl = parts[3] ? parts[3].trim() : '';

        if (!rawGrip && !name) return;

        const isSuwariWaza = rawGrip.startsWith('※');
        const cleanGrip = rawGrip.replace(/^※/, '');

        let videoUrl = rawVideoUrl;
        if (videoUrl && videoUrl.includes('x.com/smaurai_kaze')) {
          videoUrl = videoUrl.replace('x.com/smaurai_kaze', 'x.com/samurai_kaze');
        }

        const grades = [];
        for (let i = 0; i < GRADE_COLUMNS.length; i++) {
          const val = parts[4 + i] ? parts[4 + i].trim() : '';
          if (val === '1' || val === '○' || val === '①' || val === '②') {
            grades.push(GRADE_COLUMNS[i]);
          }
        }

        const primaryGrade = grades.length > 0 ? grades[0] : '';
        const displayName = `${rawGrip} ${name} ${numberLabel}`.trim();

        techniques.push({
          id: `tech-table-${index + 1}`,
          rawGrip,
          grip: cleanGrip || rawGrip,
          isSuwariWaza,
          name: name || '技',
          numberLabel,
          displayName,
          videoUrl,
          description: `${displayName}の基本技動作と体捌きの解説`,
          keyPoints: [

            '相手の重心をくずし、安全かつ確実に技を極める'
          ],
          grade: primaryGrade,
          grades,
          category: isSuwariWaza ? '座り技' : '立ち技',
          reading: '',
          difficultyRating: grades.includes('初段') || grades.includes('二段') || grades.includes('三段') ? 4 : 2,
          isMastered: false,
          isFavorite: false
        });
      });

      return techniques;
    }

              <div>
                <div className="flex flex-wrap items-center gap-1.5 mb-1">
                  <span className="px-2 py-0.5 text-[10px] font-bold bg-slate-100 text-slate-700 rounded-md">
                    {technique.rawGrip}
                  </span>
                  {technique.grades && technique.grades.length > 0 ? (
                    technique.grades.map((g) => (
                      <span key={g} className="px-2 py-0.5 text-[10px] font-bold bg-indigo-50 text-[#003d9b] rounded-md">
                        {g}
                      </span>
                    ))
                  ) : (
                    technique.grade && (
                      <span className="px-2 py-0.5 text-[10px] font-bold bg-indigo-50 text-[#003d9b] rounded-md">
                        {technique.grade}
                      </span>
                    )
                  )}

                <h2 className="text-xl font-bold text-slate-800">
                  {technique.displayName}
                </h2>
              </div>

              <button
                onClick={onClose}
                className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-4 sm:p-6 space-y-5">
              {/* Video Player Box */}
              <div className="bg-slate-900 rounded-xl overflow-hidden aspect-video relative flex flex-col items-center justify-center text-white shadow-inner">
                {technique.videoUrl ? (
                  <div className="w-full h-full flex flex-col items-center justify-center p-6 text-center space-y-3">
                    <div className="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white">
                      <Icon name="play" className="w-6 h-6 ml-1 text-white" />
                    </div>
                    <div>
                      <p className="text-sm font-semibold text-slate-200">演武・解説動画 (X / 旧Twitter)</p>
                      <p className="text-xs text-slate-400 mt-1">公式ポストの投稿動画を参照します</p>
                    </div>
                    <a
                      href={technique.videoUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-4 py-2 bg-[#003d9b] hover:bg-[#1e5bb8] text-white text-xs font-bold rounded-lg transition-all flex items-center gap-2 shadow-md"
                    >
                      <span>X (旧Twitter) で動画を再生</span>
                      <Icon name="externalLink" className="w-3.5 h-3.5" />
                    </a>
                  </div>
                ) : (
                  <div className="text-center p-6 text-slate-400">
                    <Icon name="video" className="w-10 h-10 mx-auto mb-2 opacity-50" />
                    <p className="text-xs">この技の動画リンクはまだ登録されていません</p>
                  </div>
                )}
              </div>

              {/* Key points */}
              <div className="space-y-2">
                <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                  <Icon name="sparkles" className="w-4 h-4 text-[#003d9b]" />
                  <span>動作の要点・指導ポイント</span>
                </h4>
                <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2">
                  {technique.keyPoints && technique.keyPoints.map((pt, idx) => (
                    <div key={idx} className="flex items-start gap-2 text-xs text-slate-700">
                      <span className="w-4 h-4 rounded-full bg-indigo-100 text-[#003d9b] font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">
                        {idx + 1}
                      </span>
                      <span className="leading-relaxed">{pt}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <button
                  onClick={() => onToggleFavorite(technique.id)}
                  className={`px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors flex items-center gap-1.5 ${
                    technique.isFavorite
                      ? 'bg-amber-50 text-amber-700 border-amber-200'
                      : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  <Icon
                    name="star"
                    className={`w-3.5 h-3.5 ${technique.isFavorite ? 'text-amber-500 fill-amber-500' : ''}`}
                    filled={technique.isFavorite}
                  />
                  <span>{technique.isFavorite ? 'お気に入りから外す' : 'お気に入り登録'}</span>
                </button>
              </div>

              <button
                onClick={() => onToggleMastered(technique.id)}
                className={`px-4 py-2 text-xs font-bold rounded-xl transition-all flex items-center gap-1.5 shadow-xs ${
                  technique.isMastered
                    ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                    : 'bg-[#003d9b] text-white hover:bg-[#1e5bb8]'
                }`}
              >
                <Icon name={technique.isMastered ? 'check' : 'circle'} className="w-4 h-4" />
                <span>{technique.isMastered ? '習得完了' : '習得済みにする'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // AddTechniqueModal
    const AddTechniqueModal = ({ isOpen, onClose, onAddTechnique }) => {
      const [rawGrip, setRawGrip] = useState('正面打ち');
      const [name, setName] = useState('');
      const [numberLabel, setNumberLabel] = useState('①');
      const [grade, setGrade] = useState('7・8級');
      const [videoUrl, setVideoUrl] = useState('');
      const [description, setDescription] = useState('');

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        onAddTechnique({
          rawGrip,
          grip: rawGrip.replace(/^※/, ''),
          isSuwariWaza: rawGrip.startsWith('※'),
          name: name.trim(),
          numberLabel,
          displayName: `${rawGrip} ${name.trim()} ${numberLabel}`.trim(),
          videoUrl: videoUrl.trim(),
          description: description.trim() || `${rawGrip} ${name.trim()} ${numberLabel}の演武解説`,
          keyPoints: ['正しい体さばきを意識する', '中心軸を安定させる'],
          grade,
          grades: [grade],
          category: rawGrip.startsWith('※') ? '座り技' : '立ち技',
          reading: '',
          difficultyRating: 2,
          isMastered: false,
          isFavorite: false
        });

        setName('');
        setVideoUrl('');
        setDescription('');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in">
          <div className="bg-white rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl border border-slate-200 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                <Icon name="plus" className="w-5 h-5 text-[#003d9b]" />
                <span>新しい技データを追加</span>
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="block text-slate-600 font-semibold mb-1">持ち手・攻撃動作</label>
                <select
                  value={rawGrip}
                  onChange={(e) => setRawGrip(e.target.value)}
                  className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 font-medium"
                >
                  {GRIP_CATEGORIES.filter(c => c !== 'すべて').map(c => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div className="col-span-2">
                  <label className="block text-slate-600 font-semibold mb-1">技名 *</label>
                  <input
                    type="text"
                    required
                    placeholder="例: 一ヵ条, 四方投げ"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                  />
                </div>
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">番号/型</label>
                  <input
                    type="text"
                    placeholder="①, ②, ○"
                    value={numberLabel}
                    onChange={(e) => setNumberLabel(e.target.value)}
                    className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-600 font-semibold mb-1">対象級段位</label>
                <select
                  value={grade}
                  onChange={(e) => setGrade(e.target.value)}
                  className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 font-medium"
                >
                  {ALL_GRADES.filter(g => g !== 'すべて').map(g => (
                    <option key={g} value={g}>{g}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-slate-600 font-semibold mb-1">演武動画URL (任意)</label>
                <input
                  type="url"
                  placeholder="https://x.com/..."
                  value={videoUrl}
                  onChange={(e) => setVideoUrl(e.target.value)}
                  className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                />
              </div>

              <div className="pt-2 flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-lg"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-[#003d9b] hover:bg-[#1e5bb8] text-white font-bold rounded-lg shadow-sm"
                >
                  追加登録
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // StatsDrawer
    const StatsDrawer = ({ isOpen, onClose, techniques, onSelectGradeFilter }) => {
      if (!isOpen) return null;

      const total = techniques.length;
      const mastered = techniques.filter(t => t.isMastered).length;
      const overallPct = total > 0 ? Math.round((mastered / total) * 100) : 0;

      const gradeStats = ALL_GRADES.filter(g => g !== 'すべて').map(g => {
        const list = techniques.filter(t => t.grades ? t.grades.includes(g) : t.grade === g);
        const tCount = list.length;
        const mCount = list.filter(t => t.isMastered).length;
        const pct = tCount > 0 ? Math.round((mCount / tCount) * 100) : 0;
        return { grade: g, total: tCount, mastered: mCount, pct };
      });

      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/50 backdrop-blur-xs animate-fade-in">
          <div className="bg-white w-full max-w-md h-full p-5 shadow-2xl overflow-y-auto space-y-5 flex flex-col justify-between">
            <div className="space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div className="flex items-center gap-2">
                  <Icon name="barChart" className="w-5 h-5 text-[#003d9b]" />
                  <h2 className="text-lg font-bold text-slate-800">習得進捗・統計データ</h2>
                </div>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>

              {/* Overall Progress */}
              <div className="bg-gradient-to-br from-[#003d9b] to-[#1e5bb8] p-4 rounded-xl text-white space-y-2 shadow-md">
                <div className="flex items-center justify-between text-xs text-indigo-100">
                  <span>全306技の総合達成率</span>
                  <span className="font-bold text-sm text-white">{overallPct}%</span>
                </div>
                <div className="w-full h-2.5 bg-white/20 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-emerald-400 rounded-full transition-all duration-500"
                    style={{ width: `${overallPct}%` }}
                  />
                </div>
                <p className="text-[11px] text-indigo-100 font-medium pt-1">
                  達成技数: {mastered} / {total} 技
                </p>
              </div>

              {/* Grade Stats */}
              <div className="space-y-2">
                <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">級段位別の進捗状況</h3>
                <div className="space-y-2">
                  {gradeStats.map(({ grade, total, mastered, pct }) => (
                    <div
                      key={grade}
                      onClick={() => {
                        onSelectGradeFilter(grade);
                        onClose();
                      }}
                      className="p-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl cursor-pointer transition-colors space-y-1.5"
                    >
                      <div className="flex items-center justify-between text-xs font-semibold text-slate-700">
                        <span>{grade}</span>
                        <span className="text-[#003d9b] font-bold">{mastered}/{total} ({pct}%)</span>
                      </div>
                      <div className="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                        <div
                          className="h-full bg-[#003d9b] rounded-full transition-all"
                          style={{ width: `${pct}%` }}
                        />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <button
              onClick={onClose}
              className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors"
            >
              閉じる
            </button>
          </div>
        </div>
      );
    };

    // NotificationsDrawer
    const NotificationsDrawer = ({ isOpen, onClose, notifications, onMarkAllAsRead }) => {
      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/50 backdrop-blur-xs animate-fade-in">
          <div className="bg-white w-full max-w-sm h-full p-5 shadow-2xl overflow-y-auto space-y-4 flex flex-col justify-between">
            <div className="space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div className="flex items-center gap-2">
                  <Icon name="bell" className="w-5 h-5 text-[#003d9b]" />
                  <h2 className="text-lg font-bold text-slate-800">お知らせ・アップデート</h2>
                </div>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>

              <div className="space-y-2.5">
                {notifications.map((n) => (
                  <div
                    key={n.id}
                    className={`p-3.5 rounded-xl border text-xs space-y-1 transition-all ${
                      n.isRead
                        ? 'bg-slate-50 border-slate-200 text-slate-600'
                        : 'bg-indigo-50/70 border-indigo-200 text-slate-800 font-medium'
                    }`}
                  >
                    <div className="flex items-center justify-between font-bold">
                      <span className="text-[#003d9b]">{n.title}</span>
                      <span className="text-[10px] text-slate-400">{n.timestamp}</span>
                    </div>
                    <p className="leading-relaxed text-slate-600">{n.message}</p>
                  </div>
                ))}
              </div>
            </div>

            <div className="space-y-2">
              <button
                onClick={onMarkAllAsRead}
                className="w-full py-2 bg-indigo-50 text-[#003d9b] font-semibold text-xs rounded-xl hover:bg-indigo-100 transition-colors"
              >
                すべて既読にする
              </button>
              <button
                onClick={onClose}
                className="w-full py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-200 transition-colors"
              >
                閉じる
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [techniques, setTechniques] = useState(() => {
        try {
          const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return INITIAL_TECHNIQUES;
      });

      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
      const [selectedGrade, setSelectedGrade] = useState('すべて');
      const [selectedGrip, setSelectedGrip] = useState('すべて');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('default');
      const [filterFavoritesOnly, setFilterFavoritesOnly] = useState(false);

      const [selectedTechnique, setSelectedTechnique] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isStatsOpen, setIsStatsOpen] = useState(false);
      const [isNotificationsOpen, setIsNotificationsOpen] = useState(false);

      // Save techniques
      useEffect(() => {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(techniques));
        } catch (e) {}
      }, [techniques]);

      // Grade counts
      const gradeCounts = useMemo(() => {
        const counts = {};
        ALL_GRADES.forEach((g) => {
          if (g === 'すべて') {
            counts[g] = techniques.length;
          } else {
            counts[g] = techniques.filter((t) =>
              t.grades && t.grades.length > 0 ? t.grades.includes(g) : t.grade === g
            ).length;
          }
        });
        return counts;
      }, [techniques]);

      // Grip counts
      const gripCounts = useMemo(() => {
        const counts = {};
        GRIP_CATEGORIES.forEach((cat) => {
          if (cat === 'すべて') {
            counts[cat] = techniques.length;
          } else {
            counts[cat] = techniques.filter((t) => t.rawGrip === cat).length;
          }
        });
        return counts;
      }, [techniques]);

      // Filtered techniques
      const filteredTechniques = useMemo(() => {
        let list = [...techniques];

        if (selectedGrade !== 'すべて') {
          list = list.filter((t) =>
            t.grades && t.grades.length > 0 ? t.grades.includes(selectedGrade) : t.grade === selectedGrade
          );
        }

        if (selectedGrip !== 'すべて') {
          list = list.filter((t) => t.rawGrip === selectedGrip);
        }

        if (filterFavoritesOnly) {
          list = list.filter((t) => t.isFavorite);
        }

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter((t) =>
            t.displayName.toLowerCase().includes(q) ||
            t.description.toLowerCase().includes(q) ||
            t.rawGrip.toLowerCase().includes(q) ||
            t.name.toLowerCase().includes(q) ||
            (t.videoUrl && t.videoUrl.toLowerCase().includes(q))
          );
        }

        if (sortBy === 'name') {
          list.sort((a, b) => a.displayName.localeCompare(b.displayName, 'ja'));
        } else if (sortBy === 'difficulty') {
          list.sort((a, b) => b.difficultyRating - a.difficultyRating);
        } else if (sortBy === 'grade') {
          list.sort((a, b) => (a.grade || '').localeCompare(b.grade || '', 'ja'));
        }

        return list;
      }, [techniques, selectedGrade, selectedGrip, filterFavoritesOnly, searchQuery, sortBy]);

      // Handlers
      const handleToggleMastered = (id) => {
        setTechniques((prev) =>
          prev.map((t) => (t.id === id ? { ...t, isMastered: !t.isMastered } : t))
        );
        if (selectedTechnique && selectedTechnique.id === id) {
          setSelectedTechnique((prev) => prev ? { ...prev, isMastered: !prev.isMastered } : null);
        }
      };

      const handleToggleFavorite = (id) => {
        setTechniques((prev) =>
          prev.map((t) => (t.id === id ? { ...t, isFavorite: !t.isFavorite } : t))
        );
        if (selectedTechnique && selectedTechnique.id === id) {
          setSelectedTechnique((prev) => prev ? { ...prev, isFavorite: !prev.isFavorite } : null);
        }
      };

      const handleAddTechnique = (newTech) => {
        const created = { ...newTech, id: `custom-${Date.now()}` };
        setTechniques((prev) => [created, ...prev]);
      };

      const handleResetData = () => {
        if (window.confirm('データのリセットを行い、初期技データ（306技）に戻しますか？')) {
          localStorage.removeItem(LOCAL_STORAGE_KEY);
          setTechniques(INITIAL_TECHNIQUES);
        }
      };

      const unreadNotifCount = notifications.filter((n) => !n.isRead).length;
      const masteredCount = techniques.filter((t) => t.isMastered).length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          <Header
            totalCount={techniques.length}
            masteredCount={masteredCount}
            onOpenStats={() => setIsStatsOpen(true)}
            onOpenNotifications={() => setIsNotificationsOpen(true)}
            unreadCount={unreadNotifCount}
            onOpenAddModal={() => setIsAddModalOpen(true)}
          />

          <main className="max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-4 flex-1">
            <SearchBar
              searchMode={searchQuery}
              onSearchChange={setSearchQuery}
              sortBy={sortBy}
              onSortChange={setSortBy}
              filterFavoritesOnly={filterFavoritesOnly}
              onToggleFavoritesOnly={() => setFilterFavoritesOnly(!filterFavoritesOnly)}
            />

            <GripFilter
              categories={GRIP_CATEGORIES}
              selectedGrip={selectedGrip}
              onSelectGrip={setSelectedGrip}
              gripCounts={gripCounts}
            />

            <GradeFilter
              grades={ALL_GRADES}
              selectedGrade={selectedGrade}
              onSelectGrade={setSelectedGrade}
              gradeCounts={gradeCounts}
            />

            {/* List Header / Stats bar */}
            <div className="flex items-center justify-between px-1 text-xs text-slate-500 font-medium">
              <p>
                該当する技: <span className="font-bold text-[#003d9b]">{filteredTechniques.length}</span> 件
                {selectedGrade !== 'すべて' && <span className="ml-1 text-slate-600">({selectedGrade})</span>}
                {selectedGrip !== 'すべて' && <span className="ml-1 text-slate-600">[{selectedGrip}]</span>}
              </p>

              <button
                onClick={handleResetData}
                className="flex items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors"
                title="初期化"
              >
                <Icon name="refresh" className="w-3.5 h-3.5" />
                <span>データ初期化</span>
              </button>
            </div>

            {/* Techniques Grid */}
            {filteredTechniques.length > 0 ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                {filteredTechniques.map((tech) => (
                  <TechniqueCard
                    key={tech.id}
                    technique={tech}
                    onSelect={setSelectedTechnique}
                    onToggleMastered={handleToggleMastered}
                    onToggleFavorite={handleToggleFavorite}
                  />
                ))}
              </div>
            ) : (
              <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-xs space-y-3">
                <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                  <Icon name="search" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-700">条件に一致する技が見つかりませんでした</h3>
                <p className="text-xs text-slate-500 max-w-sm mx-auto">
                  検索条件または級段位・持ち手フィルターを変更して再度お試しください。
                </p>
                <button
                  onClick={() => {
                    setSelectedGrade('すべて');
                    setSelectedGrip('すべて');
                    setSearchQuery('');
                    setFilterFavoritesOnly(false);
                  }}
                  className="px-4 py-2 bg-indigo-50 text-[#003d9b] font-bold text-xs rounded-xl hover:bg-indigo-100 transition-colors"
                >
                  フィルターをリセット
                </button>
              </div>
            )}
          </main>

          <footer className="mt-auto border-t border-slate-200 bg-white px-4 py-3 text-center text-xs text-slate-500">
            <div className="flex items-center justify-center gap-1.5 font-medium text-slate-600">
              <Icon name="bookOpen" className="w-3.5 h-3.5 text-[#003d9b]" />
              <span>塩田合気道・風</span>
            </div>
          </footer>

          {/* Modals & Drawers */}
          <VideoModal
            technique={selectedTechnique}
            onClose={() => setSelectedTechnique(null)}
            onToggleMastered={handleToggleMastered}
            onToggleFavorite={handleToggleFavorite}
          />

          <AddTechniqueModal
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            onAddTechnique={handleAddTechnique}
          />

          <StatsDrawer
            isOpen={isStatsOpen}
            onClose={() => setIsStatsOpen(false)}
            techniques={techniques}
            onSelectGradeFilter={(g) => setSelectedGrade(g)}
          />

          <NotificationsDrawer
            isOpen={isNotificationsOpen}
            onClose={() => setIsNotificationsOpen(false)}
            notifications={notifications}
            onMarkAllAsRead={() =>
              setNotifications((prev) => prev.map((n) => ({ ...n, isRead: true })))
            }
          />
        </div>
      );
    }

    // Render Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
